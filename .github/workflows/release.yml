name: Create release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read unreleased version and notes
        id: changelog
        shell: bash
        run: |
          version="$(sed -n 's/^## \([0-9][0-9.]*-alpha\) — .*/\1/p' CHANGELOG.md | head -n 1)"
          test -n "$version"
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-alpha$' <<< "$version"
          awk -v heading="## $version" '$0 == heading { capture=1; next } capture && /^## / { exit } capture { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.changelog.outputs.version }}" --title "${{ steps.changelog.outputs.version }}" --notes-file release-notes.md --prerelease --target main
