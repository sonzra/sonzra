name: Create release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    env:
      RELEASE_GIT_NAME: ${{ vars.RELEASE_GIT_NAME }}
      RELEASE_GIT_EMAIL: ${{ vars.RELEASE_GIT_EMAIL }}
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read and validate the release version
        id: release
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          [[ "$version" =~ $semver ]]
          grep -Eq "^## ${version//./\\.} — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          awk -v heading="## $version — " 'index($0, heading) == 1 { capture=1; next } capture && /^## / { exit } capture { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check signing configuration
        shell: bash
        run: |
          test -n "$RELEASE_GIT_NAME"
          test -n "$RELEASE_GIT_EMAIL"
          test -n "$RELEASE_GPG_PRIVATE_KEY"
          test -n "$RELEASE_GPG_PASSPHRASE"
      - name: Import the release signing key
        id: signing
        shell: bash
        run: |
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ { print $10; exit }')"
          test -n "$fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/gpg-sign" <<'EOF'
          #!/usr/bin/env bash
          exec gpg --batch --pinentry-mode loopback --passphrase "$RELEASE_GPG_PASSPHRASE" "$@"
          EOF
          chmod 700 "$RUNNER_TEMP/gpg-sign"
      - name: Create and push signed tag
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi
          git config user.name "$RELEASE_GIT_NAME"
          git config user.email "$RELEASE_GIT_EMAIL"
          git config user.signingkey "${{ steps.signing.outputs.fingerprint }}"
          git config gpg.program "$RUNNER_TEMP/gpg-sign"
          git tag --sign "$tag" --message "Release $tag"
          git push origin "refs/tags/$tag"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          options=(--verify-tag --title "${{ steps.release.outputs.tag }}" --notes-file release-notes.md)
          [[ "${{ steps.release.outputs.version }}" == *-* ]] && options+=(--prerelease)
          gh release create "${{ steps.release.outputs.tag }}" "${options[@]}"
