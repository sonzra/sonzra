name: Quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bundle exec rubocop
      - run: bin/rails db:prepare
      - run: bin/rails test
      - run: npm run test:javascript
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Prepare test fixtures
        run: bin/rails db:fixtures:load
        env:
          RAILS_ENV: test
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: 9a70b7d5e49390f6f7e6d8b4a9012c3d
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: cf63a9d772e4b0086e5a4c3d2f1908ab
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: 7c58d3e9a0bf4c2d1e6f9a3b8d0c7e5f
      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: true
          RAILS_ENV: test
