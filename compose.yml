services:
  sonzra:
    image: ${SONZRA_IMAGE:?Set SONZRA_IMAGE to the Sonzra image you want to run}
    ports: ["3000:3000"]
    environment:
      SONZRA_SECRET_KEY: ${SONZRA_SECRET_KEY:-}
      SOLID_QUEUE_IN_PUMA: "true"
      RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-false}
    volumes:
      - sonzra_storage:/rails/storage
volumes:
  sonzra_storage:
